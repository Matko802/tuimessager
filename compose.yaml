# Podman Compose for tuimessager (single container: server + Caddy).
# Same file works on PC (x86_64) and Raspberry Pi 5 (aarch64) —
# just build/pull the matching arch image.
#
# LAN only:   podman compose up -d            (server on :3000)
# Public TLS: TUIMESSAGER_DOMAIN=chat.example.com podman compose up -d
#             (Caddy starts too, free Let's Encrypt cert on :80/:443)
name: tuimessager

services:
  server:
    build:
      context: .
      dockerfile: Containerfile.server
    image: localhost/tuimessager:latest
    container_name: tuimessager
    restart: unless-stopped
    # Rootless Podman needs this once for ports 80/443:
    #   echo 'net.ipv4.ip_unprivileged_port_start=80' | sudo tee /etc/sysctl.d/90-rootless-ports.conf && sudo sysctl --system
    ports:
      - "3000:3000"
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      TUIMESSAGER_BIND: "0.0.0.0:3000"
      TUIMESSAGER_DATA_DIR: /data
      # Empty = LAN mode (server only). Set a domain to enable Caddy + free TLS.
      TUIMESSAGER_DOMAIN: ${TUIMESSAGER_DOMAIN:-}
      # Set to "false" after creating your first account.
      TUIMESSAGER_ALLOW_REGISTRATION: "true"
      RUST_LOG: tuimessager_server=info
    volumes:
      - tuimsg-data:/data
    healthcheck:
      # NOTE: /dev/tcp is a bashism — the image's /bin/sh is dash, so invoke
      # bash explicitly (verified present in debian:bookworm-slim).
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  tuimsg-data:
